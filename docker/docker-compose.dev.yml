services:
  backend:
    build:
      target: development
    environment:
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173
    command: ["npm", "run", "start:dev"]
    volumes:
      - ../backend/src:/app/src

  frontend:
    build:
      target: development
    environment:
      API_PROXY_TARGET: http://backend:3000
      VITE_API_BASE_URL: /api
    command: ["npm", "run", "dev"]
    ports: !override
      - "127.0.0.1:5173:5173"
    volumes:
      - ../frontend/src:/app/src
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
